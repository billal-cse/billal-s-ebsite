<div class="main">

    <h1>Electricity Bill Calculator</h1>

    <div class="box">

        <label>Monthly Units (kWh)</label>

        <input
            type="number"
            id="units"
            placeholder="Example: 150"
        >

        <label>Rate per Unit (৳)</label>

        <input
            type="number"
            id="rate"
            value="8"
        >

        <button onclick="calculateBill()">
            Calculate Bill
        </button>

        <h2 id="result">
            Estimated Cost: ৳ 0
        </h2>

    </div>

</div>

<script src="script.js"></script>

</body>
